server:
  port: 8082
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 260MB

spring:
  application:
    name: snapshot-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:metadiff}
    username: ${POSTGRES_USER:metadiff}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:metadiff_super_secret_key_change_this_in_production_32chars}
  access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}
  refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}

git:
  repo:
    path: ${GIT_REPO_PATH:./git-storage}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
