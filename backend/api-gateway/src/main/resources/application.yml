server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
        - id: snapshot-service
          uri: ${SNAPSHOT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/snapshots/**
          filters:
            - name: JwtValidationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
        - id: diff-service
          uri: ${DIFF_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/diff/**
          filters:
            - name: JwtValidationFilter
        - id: risk-service
          uri: ${RISK_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/risk/**
          filters:
            - name: JwtValidationFilter
        - id: git-service
          uri: ${GIT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/git/**
          filters:
            - name: JwtValidationFilter
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/analytics/**
          filters:
            - name: JwtValidationFilter
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: JwtValidationFilter

jwt:
  secret: ${JWT_SECRET:metadiff_super_secret_key_change_this_in_production_32chars}
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 7
