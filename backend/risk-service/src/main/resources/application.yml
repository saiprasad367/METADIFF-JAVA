server:
  port: 8084
spring:
  application:
    name: risk-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:metadiff}
    username: ${POSTGRES_USER:metadiff}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 8
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes
jwt:
  secret: ${JWT_SECRET:metadiff_super_secret_key_change_this_in_production_32chars}
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 7
services:
  diff-service-url: ${DIFF_SERVICE_URL:http://localhost:8083}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
